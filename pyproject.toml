[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-critic-lab"
version = "0.1.0"
description = "Evidence-grounded RAG, trained critique, and critic reinforcement learning for 2WikiMultiHopQA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["ijson>=3.3,<4"]
hf = ["torch>=2.6,<2.9", "transformers>=4.56,<4.58", "accelerate>=1.9,<2", "peft>=0.17,<0.18"]
train = ["rag-critic-lab[hf,data]", "datasets>=3.6,<5", "trl>=0.23,<0.24"]
quant = ["bitsandbytes>=0.47,<0.49; sys_platform == 'linux'"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
raglab = "raglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
