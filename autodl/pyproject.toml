[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team6-autodl-rag"
version = "1.0.0"
description = "Local Qwen RAG with a trajectory-GRPO LLaMA critic for AutoDL"
requires-python = ">=3.10"
dependencies = ["ijson==3.4.0", "tqdm>=4.66.4,<5"]

[project.optional-dependencies]
gpu = ["transformers==4.56.2", "peft==0.17.1", "accelerate==1.10.1", "bitsandbytes==0.47.0", "safetensors>=0.4.5,<1", "sentencepiece>=0.2,<0.3", "lm-format-enforcer==0.11.3", "pydantic==2.7.3"]

[project.scripts]
autodl-rag = "autodl_rag.cli:main"

[tool.setuptools.packages.find]
include = ["autodl_rag*"]

[tool.setuptools.package-data]
autodl_rag = ["defaults.json"]
