name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and lint tooling
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: AutoDL core tests without GPU dependencies
        run: |
          python -m pip install -e ./autodl
          python -m unittest discover -s autodl/tests -v
      - name: Offline end-to-end smoke
        run: raglab smoke --output outputs/ci-smoke
      - name: Validate SFT annotation contract without GPU
        run: raglab train-sft --config configs/training/sft.json --annotations fixtures/annotations.reviewed.jsonl --check-only
      - name: Save synthetic smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-${{ matrix.python-version }}
          path: outputs/ci-smoke/
          retention-days: 7

  autodl-tensors:
    name: AutoDL tiny LLaMA and LoRA (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autodl/pyproject.toml
      - name: Install CPU tensor test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./autodl transformers==4.56.2 peft==0.17.1 accelerate==1.10.1
      - name: Run core and real tiny-model tests
        run: python -m unittest discover -s autodl/tests -v
