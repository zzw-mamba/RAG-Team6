name: Naive RAG baseline

on:
  push:
    branches: [feat/naive-rag-baseline-v2]
  pull_request:
    paths:
      - 'src/naive_rag/**'
      - 'tests/test_baseline.py'
      - 'tests/test_validation.py'
      - 'configs/*baseline*.json'
      - 'pyproject.toml'
      - '.github/workflows/naive-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - name: Check single-pass baseline without loading server weights
        run: naive-rag run --input examples/toy.json --config configs/autodl_baseline.json --output outputs/ci-baseline-smoke --dry-run
      - name: Check labeled-data report without loading server weights
        run: naive-rag evaluate --input examples/toy.json --config configs/autodl_baseline.json --output outputs/ci-evaluation-smoke --dry-run
